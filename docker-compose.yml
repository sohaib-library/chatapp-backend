services:

  # --- PostgreSQL --------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: chatapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- EMQX (MQTT broker) ------------------------------------------------------ 
  emqx:
    image: emqx/emqx:5.8.0
    container_name: chatapp-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"    # MQTT TCP
      - "8083:8083"    # MQTT over WebSocket
      - "18083:18083"  # EMQX Dashboard  →  http://localhost:18083
    volumes:
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Go API ------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatapp-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Override host names to use Docker service names instead of localhost
      POSTGRES_HOST: postgres
      MQTT_BROKER: tcp://emqx:1883
    ports:
      - "${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy

volumes:
  postgres_data:
  emqx_data:


