apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: chatapp
spec:
  accessModes:
    - ReadWriteOnce   # Only one pod can write at a time (correct for a single DB pod)
  # Uses default storage class (local-path for k3d)
  resources:
    requests:
      storage: 1Gi
