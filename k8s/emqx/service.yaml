apiVersion: v1
kind: Service
metadata:
  name: emqx            # Other pods reach EMQX at host "emqx:1883"
  namespace: chatapp
spec:
  selector:
    app: emqx
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
      nodePort: 31403
    - name: mqtt-ws
      port: 8083
      targetPort: 8083
    - name: dashboard
      port: 18083
      targetPort: 18083
      nodePort: 30083    # Access dashboard at http://localhost:30083
  type: NodePort         # NodePort exposes dashboard + MQTT ports outside the cluster
