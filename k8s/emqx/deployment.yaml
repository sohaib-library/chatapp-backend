apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx
  namespace: chatapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emqx
  template:
    metadata:
      labels:
        app: emqx
    spec:
      containers:
        - name: emqx
          image: emqx/emqx:5.8.0
          ports:
            - containerPort: 1883    # MQTT TCP
            - containerPort: 8083    # MQTT over WebSocket
            - containerPort: 18083   # Dashboard
          readinessProbe:
            exec:
              command: ["/opt/emqx/bin/emqx", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: emqx-storage
              mountPath: /opt/emqx/data
      volumes:
        - name: emqx-storage
          emptyDir: {}    # Fine for dev — use a PVC in production
